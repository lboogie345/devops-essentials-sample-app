#
# One read-only drift audit per security category, each separately
# schedulable and separately notifiable. This is what makes drift
# monitoring per category rather than one fleet-wide pass/fail: a
# category that was clean yesterday and is red today names the area that
# is degrading and the team that owns it.
#
# Every template here is read-only. None of them can modify a host.
#
# The keys are namespaced (stig_category_*) rather than controller_*:
# aap/configure.yml loads this directory with include_vars, which would
# silently overwrite the hand-written controller_templates rather than
# add to them. configure.yml concatenates them explicitly.
# Schedules are staggered 20 minutes apart from 05:00 America/New_York
# so that nine simultaneous alerts do not get triaged as one.
