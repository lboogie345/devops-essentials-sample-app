    job_type: run
    organization: Platform Security
    project: RHEL 8 STIG CAT II
    playbook: ansible/audit.yml
    inventory: RHEL 8 Fleet
    execution_environment: stig-rhel8-cat2-ee
    credentials:
      - RHEL 8 Fleet - Machine
      - RHEL 8 Fleet - Vault
    ask_limit_on_launch: true
    become_enabled: true
    job_tags: cat_account-management
    extra_vars:
      stig_target: rhel8
      stig_category: account-management
    description: Read-only drift audit scoped to account-management. 1 control(s), NIST family
