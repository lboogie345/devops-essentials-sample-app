---
# Credential SHELLS only - names, types and ownership. No secret material is in
# this repository, and none should be: AAP holds the values, encrypted, and
# never renders them back out.
#
# Populate from an external secret manager where you have one. AAP supports
# CyberArk, HashiCorp Vault, Azure Key Vault and Thycotic as credential lookup
# sources, which is better than pasting a key into a field, because rotation
# then happens in one place.
controller_credentials:
  - name: RHEL 8 Fleet - Machine
    organization: Platform Security
    credential_type: Machine
    description: >-
      SSH key and become method for the automation account. The account needs
      sudo; several controls rewrite sudoers and PAM, so it must not depend on a
      passwordless-sudo bypass that RHEL-08-010385 removes.
    inputs:
      username: svc_stig
      become_method: sudo
      # ssh_key_data and become_password come from the lookup below.

  - name: RHEL 8 Fleet - Vault
    organization: Platform Security
    credential_type: Vault
    description: Decrypts vaulted inventory values (org-specific group names, approval refs).

  - name: GitHub - SCM read
    organization: Platform Security
    credential_type: Source Control
    description: >-
      Read-only deploy key for the content repository. Read-only on purpose:
      AAP consumes what GitHub has approved, and never writes back to it.

# Optional but recommended: source the secret material rather than storing it.
controller_credential_input_sources: []
