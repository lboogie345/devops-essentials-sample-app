line-length = 100
target-version = "py39"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
  # Long lines inside human-readable report strings stay readable as written.
  "E501",
]

[lint.per-file-ignores]
# Fixtures legitimately take arguments they only need for their side effects.
"scripts/tests/*" = ["ARG001"]
