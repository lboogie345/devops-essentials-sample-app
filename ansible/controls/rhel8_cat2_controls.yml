---
# Authoritative manifest of the RHEL 8 CAT II findings this repository remediates.
# Source: DISA STIG for Red Hat Enterprise Linux 8, V2R8, benchmark date 01 Jul 2026.
#
# This file is the contract between three things:
#   1. the Ansible role  (ansible/roles/rhel8_stig_cat2) - one task file per stig_id
#   2. the Python report (scripts/stig/report.py)        - builds the POA&M from it
#   3. the reviewers     (docs/STIG-CAT-II-Remediation.md)
#
# remediation:
#   automated  - the role fully enforces the control, no human decision required
#   gated      - the role can enforce it, but only after the org supplies a value
#                (group names, user->SELinux mappings, ISSO approval). Off by default.
#   assisted   - the role converges what it safely can and reports the rest for a human
benchmark:
  product: Red Hat Enterprise Linux 8
  version: "2"
  release: "8"
  benchmark_date: "2026-07-01"
  classification: UNCLASSIFIED

controls:
  - stig_id: RHEL-08-010019
    group_id: V-256973
    rule_id: SV-256973r1017373
    severity: CAT II
    srg: SRG-OS-000366-GPOS-00153
    title: RHEL 8 must ensure cryptographic verification of vendor software packages.
    cci: [CCI-001749, CCI-003992]
    nist: ["CM-5 (3)", "CM-14"]
    remediation: assisted
    risk: low
    reboot_required: false
    notes: >-
      Keys cannot be manufactured by automation. The role restores the vendor key
      file from the redhat-release package, imports it, and asserts the fingerprints
      against hard-coded vendor values. A host with no key file and no package cache
      is reported for manual media-based remediation.

  - stig_id: RHEL-08-010358
    group_id: V-256974
    rule_id: SV-256974r1069321
    severity: CAT II
    srg: SRG-OS-000363-GPOS-00150
    title: RHEL 8 must be configured to allow sending email notifications of unauthorized configuration changes to designated personnel.
    cci: [CCI-001744]
    nist: ["CM-3 (5)"]
    remediation: automated
    risk: low
    reboot_required: false
    notes: mailx or s-nail satisfies the check; the role accepts either.

  - stig_id: RHEL-08-010379
    group_id: V-251711
    rule_id: SV-251711r1017365
    severity: CAT II
    srg: SRG-OS-000480-GPOS-00227
    title: RHEL 8 must specify the default "include" directory for the /etc/sudoers file.
    cci: [CCI-000366]
    nist: ["CM-6 b"]
    remediation: assisted
    risk: high
    reboot_required: false
    notes: >-
      Enforced through visudo validation. Nested includes found under /etc/sudoers.d
      are reported, never deleted automatically - removing one can revoke the
      privilege path the automation itself depends on.

  - stig_id: RHEL-08-010385
    group_id: V-251712
    rule_id: SV-251712r1050789
    severity: CAT II
    srg: SRG-OS-000373-GPOS-00156
    title: The RHEL 8 operating system must not be configured to bypass password requirements for privilege escalation.
    cci: [CCI-002038, CCI-004895]
    nist: ["IA-11", "SC-11 b"]
    remediation: automated
    risk: medium
    reboot_required: false
    notes: >-
      Removing pam_succeed_if from /etc/pam.d/sudo makes sudo prompt for a password
      where it previously did not. Confirm no automation authenticates through a
      passwordless sudo that relies on this bypass before enabling.

  - stig_id: RHEL-08-010455
    group_id: V-272484
    rule_id: SV-272484r1134875
    severity: CAT II
    srg: SRG-OS-000445-GPOS-00199
    title: RHEL 8 must elevate the SELinux context when an administrator calls the sudo command.
    cci: [CCI-002235]
    nist: ["AC-6 (10)"]
    remediation: gated
    risk: high
    reboot_required: false
    notes: >-
      Requires an org-defined admin group. Off by default: a wrong sudoers entry
      locks every administrator out of privilege escalation at once.

  - stig_id: RHEL-08-020035
    group_id: V-257258
    rule_id: SV-257258r1069328
    severity: CAT II
    srg: SRG-OS-000163-GPOS-00072
    title: RHEL 8.7 and higher must terminate idle user sessions.
    cci: [CCI-001133]
    nist: ["SC-10"]
    remediation: automated
    risk: medium
    reboot_required: false
    applicability: RHEL >= 8.7
    notes: >-
      Not applicable below 8.7, and not applicable on cloud-hosted systems where
      ClientAliveInterval (V-244525) is configured. Both exclusions are wired to
      variables so the skip is recorded as Not_Applicable, not as a silent pass.

  - stig_id: RHEL-08-020101
    group_id: V-251713
    rule_id: SV-251713r1017366
    severity: CAT II
    srg: SRG-OS-000480-GPOS-00227
    title: RHEL 8 must ensure the password complexity module is enabled in the system-auth file.
    cci: [CCI-000366]
    nist: ["CM-6 b"]
    remediation: assisted
    risk: high
    reboot_required: false
    notes: >-
      /etc/pam.d/system-auth is owned by authselect. Editing it in place is reverted
      by the next authselect apply and breaks `authselect check`. The role edits the
      custom authselect profile instead and re-applies it.

  - stig_id: RHEL-08-020104
    group_id: V-251716
    rule_id: SV-251716r1069329
    severity: CAT II
    srg: SRG-OS-000480-GPOS-00227
    title: RHEL 8 systems, version 8.4 and above, must ensure the password complexity module is configured for three retries or less.
    cci: [CCI-000366]
    nist: ["CM-6 b"]
    remediation: automated
    risk: low
    reboot_required: false
    applicability: RHEL >= 8.4

  - stig_id: RHEL-08-020360
    group_id: V-279929
    rule_id: SV-279929r1156340
    severity: CAT II
    srg: SRG-OS-000163-GPOS-00072
    title: RHEL 8 must automatically exit interactive command shell user sessions after 10 minutes of inactivity.
    cci: [CCI-001133]
    nist: ["SC-10"]
    remediation: automated
    risk: medium
    reboot_required: false

  - stig_id: RHEL-08-030655
    group_id: V-274877
    rule_id: SV-274877r1155381
    severity: CAT II
    srg: SRG-OS-000471-GPOS-00215
    title: RHEL 8 must audit any script or executable called by cron as root or by any privileged user.
    cci: [CCI-000172]
    nist: ["AU-12 c"]
    remediation: automated
    risk: low
    reboot_required: conditional
    notes: >-
      If auditd is in immutable mode (-e 2) the new rules only take effect after a
      reboot. The role detects this and reports reboot_required rather than claiming
      compliance the running kernel does not have.

  - stig_id: RHEL-08-040221
    group_id: V-284948
    rule_id: SV-284948r1208757
    severity: CAT II
    srg: SRG-OS-000420-GPOS-00186
    title: RHEL 8 must log IPv4 packets with impossible addresses.
    cci: [CCI-002386]
    nist: ["SC-5"]
    remediation: automated
    risk: low
    reboot_required: false

  - stig_id: RHEL-08-040222
    group_id: V-284949
    rule_id: SV-284949r1208759
    severity: CAT II
    srg: SRG-OS-000420-GPOS-00186
    title: RHEL 8 must log IPv4 packets with impossible addresses by default.
    cci: [CCI-002386]
    nist: ["SC-5"]
    remediation: automated
    risk: low
    reboot_required: false

  - stig_id: RHEL-08-040287
    group_id: V-284947
    rule_id: SV-284947r1210519
    severity: CAT II
    srg: SRG-OS-000420-GPOS-00186
    title: RHEL 8 must use a reverse-path filter for IPv4 network traffic, when possible, by default.
    cci: [CCI-002385]
    nist: ["SC-5", "SC-5 a"]
    remediation: automated
    risk: medium
    reboot_required: false
    notes: >-
      rp_filter must not be strict on asymmetric-routing hosts. The role sets the
      `default` scope only and leaves existing interfaces alone unless explicitly
      told otherwise.

  - stig_id: RHEL-08-040321
    group_id: V-251718
    rule_id: SV-251718r1017371
    severity: CAT II
    srg: SRG-OS-000480-GPOS-00227
    title: The graphical display manager must not be the default target on RHEL 8 unless approved.
    cci: [CCI-000366]
    nist: ["CM-6 b"]
    remediation: gated
    risk: medium
    reboot_required: true
    notes: >-
      Hosts with an ISSO-documented GUI requirement are exempted by inventory
      variable, which produces a Not_Applicable with the approval reference
      recorded in the evidence artifact.

  - stig_id: RHEL-08-040400
    group_id: V-254520
    rule_id: SV-254520r1069331
    severity: CAT II
    srg: SRG-OS-000324-GPOS-00125
    title: >-
      RHEL 8 must prevent nonprivileged users from executing privileged functions,
      including disabling, circumventing, or altering implemented security
      safeguards/countermeasures.
    cci: [CCI-002235]
    nist: ["AC-6 (10)"]
    remediation: gated
    risk: high
    reboot_required: false
    notes: >-
      SELinux login mappings are per-account org data, not a setting. Off by default.
      Mapping an admin to sysadm_u blocks their SSH login unless ssh_sysadm_login is
      set, which itself needs an ISSO-documented operational requirement.
