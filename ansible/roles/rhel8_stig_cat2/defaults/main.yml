---
# ============================================================================
# rhel8_stig_cat2 - RHEL 8 STIG V2R8 CAT II remediation
# ============================================================================
# Every control has its own enable flag so a system owner can stage the rollout
# and so an accepted risk can be turned off in inventory rather than by forking
# the role. Controls that need org data or ISSO approval default to false.

# ---------------------------------------------------------------------------
# Global behaviour
# ---------------------------------------------------------------------------
# Audit-only: gather and report state, converge nothing. Same effect as
# --check, but usable in a pipeline that must not pass --check to other roles.
stig_audit_only: false

# Write a per-host JSON evidence file the Python reporter turns into a POA&M.
stig_write_evidence: true
stig_evidence_dir: /var/log/stig

# Back up every file the role rewrites, next to the original.
stig_backup: true

# Change-management reference for this run. Passed in by the pipeline and
# recorded in the evidence document, so the artifact answers "who authorized
# this change" without a separate lookup.
stig_change_ticket: ""

# Definition of a "local interactive user" shared by the home-directory
# controls (RHEL-08-010731, -010741, -020352, -010590). The STIG's own wording
# is UID >= 1000 with a real login shell.
stig_interactive_uid_min: 1000
# Accounts to leave alone even though they match. Application accounts with an
# ISSO-documented exception belong here, not in a fork of the role.
stig_home_user_exclusions: []

# ---------------------------------------------------------------------------
# RHEL-08-010019 | vendor package signing keys
# ---------------------------------------------------------------------------
stig_010019_enabled: true
stig_010019_keyfile: /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
# Reinstall redhat-release to restore a missing key file. Needs a reachable repo.
stig_010019_allow_pkg_reinstall: true
# Vendor fingerprints, https://access.redhat.com/security/team/key
# release key 2 and auxiliary key. Do not edit without checking that page.
stig_010019_expected_fingerprints:
  - "567E347AD0044ADE55BA8A5F199E2F91FD431D51"
  - "6A6AA7C97C8890AEC6AEBFE2F76F66C3D4082792"

# ---------------------------------------------------------------------------
# RHEL-08-010358 | mail transport for configuration-change notification
# ---------------------------------------------------------------------------
stig_010358_enabled: true
# s-nail is an accepted substitute for mailx per the check text.
stig_010358_package: mailx

# ---------------------------------------------------------------------------
# RHEL-08-010379 | sudoers include directive
# ---------------------------------------------------------------------------
stig_010379_enabled: true
# Nested includes under /etc/sudoers.d are reported by default. Set true only
# after a human has read the report - deleting the wrong include can strip the
# privilege path this role runs through.
stig_010379_remove_nested_includes: false

# ---------------------------------------------------------------------------
# RHEL-08-010385 | no password bypass for privilege escalation
# ---------------------------------------------------------------------------
stig_010385_enabled: true

# ---------------------------------------------------------------------------
# RHEL-08-010455 | elevate SELinux context on sudo    [GATED]
# ---------------------------------------------------------------------------
# Requires an org-defined administrator group that already exists on the host.
stig_010455_enabled: false
stig_010455_admin_group: ""          # e.g. "sysadmins" -> %sysadmins
stig_010455_sudoers_file: /etc/sudoers.d/stig_selinux_admins

# ---------------------------------------------------------------------------
# RHEL-08-020035 | terminate idle sessions (RHEL 8.7+)
# ---------------------------------------------------------------------------
stig_020035_enabled: true
stig_020035_stop_idle_session_sec: 600
# Cloud-hosted systems that satisfy V-244525 via ClientAliveInterval are exempt.
stig_020035_cloud_hosted: false

# ---------------------------------------------------------------------------
# RHEL-08-020101 | pam_pwquality enabled in system-auth
# ---------------------------------------------------------------------------
stig_020101_enabled: true
# Name of the authselect custom profile to create/maintain. RHEL 8 regenerates
# /etc/pam.d/system-auth from this profile, so this is the only durable edit.
stig_020101_authselect_profile: stig
# Fall back to editing /etc/pam.d/system-auth directly when authselect is not in
# use on the host (rare - typically hosts converted from RHEL 7).
stig_020101_allow_direct_pam_edit: true

# ---------------------------------------------------------------------------
# RHEL-08-020104 | pwquality retry (RHEL 8.4+)
# ---------------------------------------------------------------------------
stig_020104_enabled: true
stig_020104_retry: 3

# ---------------------------------------------------------------------------
# RHEL-08-020360 | TMOUT for interactive shells
# ---------------------------------------------------------------------------
stig_020360_enabled: true
stig_020360_tmout: 600
stig_020360_file: /etc/profile.d/tmout.sh
# `declare -xr` makes TMOUT readonly. Re-sourcing /etc/profile in an already
# logged-in shell then prints "TMOUT: readonly variable". A new shell is
# unaffected. Set true to add a re-entrancy guard; some strict scanners want
# the bare line at column 0, so this stays false by default.
stig_020360_reentrant_guard: false

# ---------------------------------------------------------------------------
# RHEL-08-030655 | audit cron scripts
# ---------------------------------------------------------------------------
stig_030655_enabled: true
stig_030655_rules_file: /etc/audit/rules.d/50-stig-cronjobs.rules

# ---------------------------------------------------------------------------
# RHEL-08-040221 / 040222 / 040287 | kernel network parameters
# ---------------------------------------------------------------------------
stig_040221_enabled: true
stig_040222_enabled: true
stig_040287_enabled: true
stig_sysctl_martians_file: /etc/sysctl.d/ipv4_log_martians.conf
stig_sysctl_rpfilter_file: /etc/sysctl.d/ipv4_rp_filter.conf
# `default.*` only affects interfaces created after the change. Set true to push
# rp_filter onto already-configured interfaces too. Leave false on any host with
# asymmetric routing (multi-homed, VPN concentrators, routers).
stig_040287_apply_to_existing_interfaces: false
# STIG scanners fail a host that sets the same key twice with different values.
# This finds conflicting definitions in lower-precedence files and reports them.
stig_sysctl_report_conflicts: true

# ---------------------------------------------------------------------------
# RHEL-08-040321 | default systemd target    [GATED]
# ---------------------------------------------------------------------------
stig_040321_enabled: true
# Set true on hosts with an ISSO-documented GUI requirement; record the approval
# reference so it lands in the evidence artifact instead of looking like a miss.
stig_040321_gui_approved: false
stig_040321_gui_approval_ref: ""

# ---------------------------------------------------------------------------
# RHEL-08-040400 | SELinux confined user mappings    [GATED]
# ---------------------------------------------------------------------------
stig_040400_enabled: false
# Mapping an admin to sysadm_u blocks their SSH login unless ssh_sysadm_login is
# on, which needs its own ISSO documentation. Prefer staff_u for admins who must
# reach the host over SSH.
stig_040400_logins: []
#   - login: jsmith
#     seuser: staff_u
#     serange: "s0-s0:c0.c1023"
# Map the catch-all __default__ login to user_u. This is the highest-blast-radius
# task in the role: it changes the SELinux user of every account not explicitly
# mapped, including future ones. Stage it on a non-production host first.
stig_040400_set_default_user_u: false
stig_040400_ssh_sysadm_login: false

# ===========================================================================
# Controls added from RHEL8-V2R8-CAT_II-002.txt
# ===========================================================================

# Shared by every PKI/MFA control (RHEL-08-010090, -010400, -020090, -020250).
# The check texts all carry the same escape: "If the System Administrator
# demonstrates the use of an approved alternate multifactor authentication
# method, this requirement is not applicable." Setting this records them as
# Not_Applicable with the reference attached, rather than leaving four
# permanent Open findings that nobody can close.
stig_mfa_alternate: false
stig_mfa_alternate_ref: ""

# ---------------------------------------------------------------------------
# RHEL-08-010090 | PKI trust anchor
# ---------------------------------------------------------------------------
stig_010090_ca_db: /etc/sssd/pki/sssd_auth_ca_db.pem
# Path to a vetted DoD CA bundle on the control node. Empty means verify-only.
# Never point this at a URL: fetching a trust anchor over the network defeats
# the control it is meant to satisfy.
stig_010090_ca_source: ""

# ---------------------------------------------------------------------------
# RHEL-08-010400 | certificate status checking
# ---------------------------------------------------------------------------
stig_010400_verification: "ocsp_dgst=sha1"

# ---------------------------------------------------------------------------
# RHEL-08-010490 | SSH private host key permissions
# ---------------------------------------------------------------------------
stig_010490_enabled: true
# Restarting sshd does not drop established sessions, but it is still a service
# restart on every host in the batch. Set false to defer to a maintenance window.
stig_010490_restart_sshd: true

# ---------------------------------------------------------------------------
# RHEL-08-010590 | noexec on home directory filesystems    [GATED]
# ---------------------------------------------------------------------------
# Off by default: this edits /etc/fstab, and a malformed entry can leave a host
# unbootable with recovery only through console access.
stig_010590_enabled: false
# Remount immediately rather than waiting for a reboot. noexec takes effect for
# new executions at remount; long-running processes already started from the
# filesystem are unaffected.
stig_010590_remount: false

# ---------------------------------------------------------------------------
# RHEL-08-010731 | home directory file modes
# ---------------------------------------------------------------------------
stig_010731_enabled: true

# ---------------------------------------------------------------------------
# RHEL-08-010741 | home directory group ownership
# ---------------------------------------------------------------------------
stig_010741_enabled: true
# Report-only by default. Re-grouping to the owner's primary group breaks
# deliberate shared-group arrangements, which the check text allows when the
# ISSO has documented them.
stig_010741_fix: false

# ---------------------------------------------------------------------------
# RHEL-08-020017 | faillock tally persistence
# ---------------------------------------------------------------------------
stig_020017_enabled: true
stig_020017_dir: /var/log/faillock

# ---------------------------------------------------------------------------
# RHEL-08-020090 | PKI certificate mapping    [GATED]
# ---------------------------------------------------------------------------
stig_020090_enabled: false
stig_020090_certmap: {}
#   domain: example.mil
#   rule_name: stig_rule
#   matchrule: "<SAN>.*EDIPI@mil"
#   maprule: "(userCertificate;binary={cert!bin})"

# ---------------------------------------------------------------------------
# RHEL-08-020250 | smart card logon    [GATED]
# ---------------------------------------------------------------------------
stig_020250_enabled: false

# ---------------------------------------------------------------------------
# RHEL-08-020320 | unnecessary accounts    [GATED]
# ---------------------------------------------------------------------------
stig_020320_enabled: false
# Accounts to delete, named explicitly after comparison against the system's
# authorized-user list. The role never derives this list itself.
stig_020320_remove_accounts: []
stig_020320_remove_home: false
# Never removable by this role, whatever inventory says. Deleting the automation
# account mid-run ends the run and the ability to repair it.
stig_020320_protected_accounts:
  - root
  - "{{ ansible_user | default('ansible') }}"

# ---------------------------------------------------------------------------
# RHEL-08-020352 | umask 077 for interactive users
# ---------------------------------------------------------------------------
stig_020352_enabled: true
# Removal is opt-in: an application account may hold a documented exception.
stig_020352_remove: false

# ---------------------------------------------------------------------------
# RHEL-08-040030 | PPSM ports, protocols and services    [MANUAL]
# ---------------------------------------------------------------------------
# No enable flag. There is no automatable fix; the role always gathers evidence
# and always reports Open. Closure is a documented human comparison.
stig_040030_enabled: true

# ---------------------------------------------------------------------------
# RHEL-08-040137 | fapolicyd application allow listing    [GATED]
# ---------------------------------------------------------------------------
stig_040137_enabled: false
# Separate from _enabled on purpose. Enabling the control stages fapolicyd in
# permissive mode; this flag is the one that actually starts denying execution,
# and it should only be set once the allow list has been built and tested.
stig_040137_enforce: false
stig_040137_denyall_rule_file: /etc/fapolicyd/rules.d/99-stig-deny-all.rules

# ---------------------------------------------------------------------------
# RHEL-08-040140 | USBGuard    [GATED]
# ---------------------------------------------------------------------------
stig_040140_enabled: false
# Generate a policy from the devices attached at run time when none exists.
# Only safe when the host currently has exactly the peripherals it should keep.
stig_040140_generate_policy: false
