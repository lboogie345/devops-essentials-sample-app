---
# RHEL-08-020101 | pam_pwquality must be enabled in /etc/pam.d/system-auth.
#
# The mistake most remediation scripts make: they edit /etc/pam.d/system-auth
# with lineinfile. On RHEL 8 that file is generated by authselect. The edit
# survives until the next `authselect apply-changes` or package update, then
# silently disappears and the finding returns. `authselect check` also starts
# reporting the file as modified, which is its own finding.
#
# The durable fix is to own a custom authselect profile and edit its template.

- name: RHEL-08-020101 | Determine whether authselect manages the PAM stack
  ansible.builtin.set_fact:
    stig_authselect_in_use: "{{ (stig_authselect_current.rc | default(1)) == 0 }}"
    stig_authselect_profile_id: "{{ (stig_authselect_current.stdout | default('')).split() | first | default('') }}"
    stig_authselect_features: "{{ (stig_authselect_current.stdout | default('')).split()[1:] | default([]) }}"

- name: RHEL-08-020101 | Remediate through a custom authselect profile
  when: stig_authselect_in_use | bool
  block:
    - name: RHEL-08-020101 | Create the custom authselect profile from the active one
      ansible.builtin.command:
        cmd: >-
          authselect create-profile {{ stig_020101_authselect_profile }}
          -b {{ stig_authselect_profile_id | regex_replace('^custom/', '') }}
          --symlink-meta
        creates: "/etc/authselect/custom/{{ stig_020101_authselect_profile }}/system-auth"
      when:
        - not (stig_audit_only | bool)
        - not stig_authselect_profile_id.startswith('custom/')

    - name: RHEL-08-020101 | Point at the profile template that will be edited
      ansible.builtin.set_fact:
        stig_020101_target: >-
          {{ stig_authselect_profile_id.startswith('custom/')
             | ternary('/etc/authselect/' ~ stig_authselect_profile_id ~ '/system-auth',
                       '/etc/authselect/custom/' ~ stig_020101_authselect_profile ~ '/system-auth') }}

    - name: RHEL-08-020101 | Ensure pam_pwquality is present in the profile template
      ansible.builtin.lineinfile:
        path: "{{ stig_020101_target }}"
        regexp: '^[[:space:]]*password[[:space:]]+requisite[[:space:]]+pam_pwquality\.so'
        line: "password    requisite                                    pam_pwquality.so try_first_pass local_users_only"
        insertbefore: '^[[:space:]]*password[[:space:]]+(sufficient|required)[[:space:]]+pam_unix\.so'
        firstmatch: true
        owner: root
        group: root
        mode: "0644"
        backup: "{{ stig_backup | bool }}"
      register: stig_020101_profile_edit
      when: not (stig_audit_only | bool)

    - name: RHEL-08-020101 | Select the custom profile, keeping the existing features
      ansible.builtin.command:
        cmd: >-
          authselect select custom/{{ stig_020101_authselect_profile }}
          {{ stig_authselect_features | join(' ') }} --force
      register: stig_020101_select
      changed_when: true
      when:
        - not (stig_audit_only | bool)
        - not stig_authselect_profile_id.startswith('custom/')

    - name: RHEL-08-020101 | Regenerate the PAM files from the profile
      ansible.builtin.command:
        cmd: authselect apply-changes -b
      changed_when: true
      when:
        - not (stig_audit_only | bool)
        - stig_020101_profile_edit.changed | default(false)

- name: RHEL-08-020101 | Remediate directly when authselect is not in use
  when:
    - not (stig_authselect_in_use | bool)
    - stig_020101_allow_direct_pam_edit | bool
  block:
    - name: RHEL-08-020101 | Ensure pam_pwquality is present in /etc/pam.d/system-auth
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: '^[[:space:]]*password[[:space:]]+requisite[[:space:]]+pam_pwquality\.so'
        line: "password    requisite                                    pam_pwquality.so try_first_pass local_users_only"
        insertbefore: '^[[:space:]]*password[[:space:]]+(sufficient|required)[[:space:]]+pam_unix\.so'
        firstmatch: true
        owner: root
        group: root
        mode: "0644"
        backup: "{{ stig_backup | bool }}"
      register: stig_020101_direct_edit
      when: not (stig_audit_only | bool)

- name: RHEL-08-020101 | Verify the rendered PAM stack actually contains the module
  ansible.builtin.shell:
    cmd: "set -o pipefail; grep -n 'pam_pwquality.so' /etc/pam.d/system-auth || true"
    executable: /bin/bash
  register: stig_020101_verify
  changed_when: false
  check_mode: false

- name: RHEL-08-020101 | Determine whether the rendered stack is compliant
  ansible.builtin.set_fact:
    stig_020101_compliant: "{{ stig_020101_verify.stdout | default('') | length > 0 }}"

- name: RHEL-08-020101 | Record result
  ansible.builtin.include_tasks: record.yml
  vars:
    _stig_id: RHEL-08-020101
    _status: >-
      {{ stig_020101_compliant | bool | ternary('NotAFinding',
         (stig_audit_only | bool) | ternary('Open', 'Not_Reviewed')) }}
    _changed: >-
      {{ (stig_020101_profile_edit.changed | default(false))
         or (stig_020101_direct_edit.changed | default(false)) }}
    _detail: >-
      {{ (stig_authselect_in_use | bool)
         | ternary('Managed via authselect profile ' ~ (stig_020101_target | default('n/a')),
                   'authselect not in use; /etc/pam.d/system-auth edited directly') }}.
      Rendered stack: {{ stig_020101_verify.stdout_lines | default(['pam_pwquality.so NOT FOUND']) | join('; ') }}
