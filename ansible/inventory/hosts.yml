---
# Hosts whose filesystems the orchestrator watches.
# Replace the samples with your own RHEL/CentOS/Fedora nodes.
all:
  children:
    disk_managed:
      children:
        webservers:
          hosts:
            web01.example.com:
            web02.example.com:
        dbservers:
          hosts:
            db01.example.com:
              # Per-host override: databases get expanded sooner.
              disk_threshold_critical: 90
    # Used by simulate.yml so you can rehearse every branch without a fleet.
    simulation:
      hosts:
        localhost:
          ansible_connection: local
