# Ansible configuration for the disk-utilization orchestrator.
# Values here are lab-friendly defaults; override per site in your own ansible.cfg.
[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = True
forks                = 20
stdout_callback      = ansible.builtin.default
result_format        = yaml
# profile_tasks/timer live in the ansible.posix collection as of ansible-core 2.19:
# callbacks_enabled  = ansible.posix.profile_tasks, ansible.posix.timer
interpreter_python   = auto_silent
retry_files_enabled  = False
display_skipped_hosts = False

[privilege_escalation]
become        = True
become_method = ansible.builtin.sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
