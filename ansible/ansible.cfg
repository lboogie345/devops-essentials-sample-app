[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = True
forks                = 25
timeout              = 30
stdout_callback      = yaml
callbacks_enabled    = ansible.posix.profile_tasks, ansible.posix.timer
interpreter_python   = auto_silent
retry_files_enabled  = False
# Every run is logged on the control node. On a delegated runner this path is
# collected as a pipeline artifact; it is the execution record behind the POA&M.
log_path             = ./ansible-run.log

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
# become_ask_pass stays default (False); the runner authenticates with a vaulted
# credential or an SSH certificate, never an interactive prompt.

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
