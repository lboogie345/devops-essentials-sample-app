---
name: STIG drift detection

# Continuous monitoring, in the NIST CA-7 sense. A baseline applied once and
# never re-checked is a point-in-time assertion; a nightly read-only audit is a
# control. This never changes a host - it runs the audit playbook, which is the
# same role in audit-only mode.
on:
  schedule:
    # 06:00 UTC daily, before the working day in most of the fleet's timezones.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Inventory group to audit'
        required: false
        type: string
        default: rhel8

permissions:
  contents: read
  issues: write

concurrency:
  group: stig-drift
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ inputs.tier || 'rhel8' }}
    runs-on: [self-hosted, linux, ansible-control]
    timeout-minutes: 60
    outputs:
      drifted: ${{ steps.report.outputs.drifted }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: pip install -r scripts/stig/requirements-dev.txt

      - name: Install pinned collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the SSH key for the automation account
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_stig
          chmod 0600 ~/.ssh/id_stig
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Run the read-only audit
        working-directory: ansible
        continue-on-error: true
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_stig
          STIG_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: |
          ansible-playbook audit.yml \
            --extra-vars "stig_target=${{ inputs.tier || 'rhel8' }}"

      - name: Build the compliance report
        id: report
        run: |
          set +e
          python scripts/stig/report.py evidence \
            --controls ansible/controls/rhel8_cat2_controls.yml \
            --markdown "${{ runner.temp }}/summary.md" \
            --poam evidence/poam.csv \
            --junit evidence/junit.xml
          rc=$?
          set -e
          cat "${{ runner.temp }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 2 ]; then
            echo "reporter failed to read the evidence" >&2
            exit 2
          fi
          echo "drifted=$([ "$rc" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/id_stig

      - name: Upload the evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stig-drift-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      - name: Open or update the drift issue
        if: steps.report.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/summary.md', 'utf8');
            const title = 'STIG drift: RHEL 8 CAT II findings open';
            const footer =
              `\n\n[Evidence artifact](${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId})` +
              '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

            // One issue, updated. A new issue every night trains people to
            // ignore the notification, which defeats the point of the control.
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'stig-drift',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing[0].number, body: body + footer,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body: body + footer,
                labels: ['stig-drift', 'security', 'compliance'],
              });
            }

      - name: Close the drift issue once the fleet is clean
        if: steps.report.outputs.drifted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'stig-drift',
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Fleet is clean as of this run; no CAT II findings remain open.' +
                      '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }
